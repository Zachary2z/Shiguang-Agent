[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiguang-backend"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for Shiguang"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "beautifulsoup4>=4.15,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=2.46,<3",
    "asyncpg>=0.30,<1",
    "APScheduler>=3.11,<4",
    "Pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "nanobot_core*"]

[tool.setuptools.package-data]
nanobot_core = ["THIRD_PARTY_LICENSES/*.txt"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "strict"
markers = [
    "postgresql: requires an explicitly configured local PostgreSQL test server",
    "real_provider: requires explicit authorization and complete real model configuration",
    "real_map_provider: requires explicit authorization and complete real Amap configuration",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "migrations", "nanobot_core"]
