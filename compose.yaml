name: shiguang

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiguang
      POSTGRES_USER: shiguang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiguang-local-only}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiguang -d shiguang"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://shiguang:${POSTGRES_PASSWORD:-shiguang-local-only}@postgres:5432/shiguang
      LOG_LEVEL: INFO
      RUN_REAL_MODEL_TESTS: "0"
      RUN_REAL_MAP_TESTS: "0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://shiguang:${POSTGRES_PASSWORD:-shiguang-local-only}@postgres:5432/shiguang
      LOG_LEVEL: INFO
      WORKER_POLL_SECONDS: "1"
      RUN_REAL_MODEL_TESTS: "0"
      RUN_REAL_MAP_TESTS: "0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
