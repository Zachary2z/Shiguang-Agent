name: shiguang

x-runtime-environment: &runtime-environment
  - APP_ENV=development
  - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}
  - DATABASE_URL=postgresql+asyncpg://shiguang:${POSTGRES_PASSWORD:-shiguang-local-only}@postgres:5432/shiguang
  - DEMO_DATABASE_URL=postgresql+asyncpg://shiguang:${DEMO_POSTGRES_PASSWORD:-shiguang-demo-local-only}@demo-postgres:5432/shiguang_demo
  - DEMO_ENABLED=1
  - WEB_SESSION_COOKIE_SECURE=0
  - REAL_WEB_SESSION_TTL_SECONDS=${REAL_WEB_SESSION_TTL_SECONDS:-2592000}
  - DEMO_WEB_SESSION_TTL_SECONDS=${DEMO_WEB_SESSION_TTL_SECONDS:-7200}
  - LOG_LEVEL=${LOG_LEVEL:-INFO}
  - MODEL_API_BASE
  - MODEL_API_KEY
  - MODEL_NAME
  - MODEL_TIMEOUT_SECONDS=${MODEL_TIMEOUT_SECONDS:-75}
  - MODEL_STRUCTURED_OUTPUT_MODE=${MODEL_STRUCTURED_OUTPUT_MODE:-json_object}
  - MODEL_INPUT_PRICE_PER_MILLION_TOKENS
  - MODEL_OUTPUT_PRICE_PER_MILLION_TOKENS
  - MODEL_COST_CURRENCY=${MODEL_COST_CURRENCY:-CNY}
  - MODEL_PRICING_SOURCE=${MODEL_PRICING_SOURCE:-configured_model_rates}
  - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-8}
  - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-60}
  - WORKER_POLL_SECONDS=${WORKER_POLL_SECONDS:-1}
  - AMAP_API_KEY
  - AMAP_BASE_URL=${AMAP_BASE_URL:-https://restapi.amap.com}
  - AMAP_TIMEOUT_SECONDS=${AMAP_TIMEOUT_SECONDS:-5}
  - AMAP_MAX_RETRIES=${AMAP_MAX_RETRIES:-1}
  - AMAP_RETRY_AFTER_MAX_SECONDS=${AMAP_RETRY_AFTER_MAX_SECONDS:-1}
  - PLACE_MATCH_UNIQUE_SCORE=${PLACE_MATCH_UNIQUE_SCORE:-75}
  - PLACE_MATCH_MINIMUM_SCORE_GAP=${PLACE_MATCH_MINIMUM_SCORE_GAP:-12}
  - PLACE_MATCH_CANDIDATE_SCORE=${PLACE_MATCH_CANDIDATE_SCORE:-35}
  - STORAGE_PRIVATE_ROOT=/app/data/private
  - DEMO_STORAGE_PRIVATE_ROOT=/app/data/demo-private
  - STORAGE_MAX_FILE_SIZE_BYTES=${STORAGE_MAX_FILE_SIZE_BYTES:-10000000}
  - STORAGE_ALLOWED_CONTENT_TYPES=${STORAGE_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp}
  - RUN_REAL_MODEL_TESTS=0
  - RUN_REAL_MAP_TESTS=0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiguang
      POSTGRES_USER: shiguang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiguang-local-only}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiguang -d shiguang"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiguang_demo
      POSTGRES_USER: shiguang
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:-shiguang-demo-local-only}
      TZ: UTC
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiguang -d shiguang_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        for variable_name in
        MODEL_API_BASE MODEL_API_KEY MODEL_NAME MODEL_TIMEOUT_SECONDS
        MODEL_STRUCTURED_OUTPUT_MODE MODEL_INPUT_PRICE_PER_MILLION_TOKENS
        MODEL_OUTPUT_PRICE_PER_MILLION_TOKENS MODEL_COST_CURRENCY
        MODEL_PRICING_SOURCE AGENT_MAX_TOOL_CALLS AGENT_TIMEOUT_SECONDS
        AMAP_API_KEY AMAP_BASE_URL AMAP_TIMEOUT_SECONDS AMAP_MAX_RETRIES
        AMAP_RETRY_AFTER_MAX_SECONDS;
        do
        if [ -z "$$(printenv "$$variable_name")" ]; then unset "$$variable_name"; fi;
        done &&
        python -m alembic upgrade head &&
        DATABASE_URL="$$DEMO_DATABASE_URL" python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *runtime-environment
    volumes:
      - private-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        for variable_name in
        MODEL_API_BASE MODEL_API_KEY MODEL_NAME MODEL_TIMEOUT_SECONDS
        MODEL_STRUCTURED_OUTPUT_MODE MODEL_INPUT_PRICE_PER_MILLION_TOKENS
        MODEL_OUTPUT_PRICE_PER_MILLION_TOKENS MODEL_COST_CURRENCY
        MODEL_PRICING_SOURCE AGENT_MAX_TOOL_CALLS AGENT_TIMEOUT_SECONDS
        AMAP_API_KEY AMAP_BASE_URL AMAP_TIMEOUT_SECONDS AMAP_MAX_RETRIES
        AMAP_RETRY_AFTER_MAX_SECONDS;
        do
        if [ -z "$$(printenv "$$variable_name")" ]; then unset "$$variable_name"; fi;
        done &&
        exec python -m app.worker
    environment: *runtime-environment
    volumes:
      - private-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  demo-postgres-data:
  private-data:
